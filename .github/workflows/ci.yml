name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scene bundle is committed, so a stale one means someone edited the
      # scene and shipped the old build
      - run: pnpm verify:scene
      - run: pnpm typecheck
      - run: pnpm build:dist
